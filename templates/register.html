{% extends "base.html" %}{% block title %}Create Student Account{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card wide"><div class="eyebrow">STUDENT PORTAL</div><h1>Create your account</h1><p class="muted">Use your institutional details to get started.</p><form method="post" class="row g-3"><div class="col-md-6"><label>Full name</label><input class="form-control" name="full_name" required></div><div class="col-md-6"><label>Email address</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label>Student ID</label><input class="form-control" name="student_id" required></div><div class="col-md-6"><label>Department</label><input class="form-control" name="department" required placeholder="e.g. CSE"></div><div class="col-12"><label>Password (minimum 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-12"><button class="btn btn-primary w-100">Create account</button></div></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
